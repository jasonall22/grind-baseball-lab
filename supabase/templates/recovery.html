<h2>Reset your password</h2>
<p>Use this reset code to update your Grind Baseball Lab family account password:</p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 6px; margin: 20px 0;">{{ .Token }}</p>
<p>
  <a href="{{ .RedirectTo }}?reset=password" style="display: inline-block; background: #000000; color: #ffffff; padding: 12px 18px; text-decoration: none; border-radius: 6px; font-weight: 700;">
    Reset password
  </a>
</p>
<p>If the button does not open, go to {{ .RedirectTo }} and choose Sign in, then Forgot password.</p>
<p>If you did not request this, you can safely ignore this email.</p>
